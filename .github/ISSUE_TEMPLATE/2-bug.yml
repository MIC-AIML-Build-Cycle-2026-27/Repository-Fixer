name: Bug report
description: Something is broken or behaves unexpectedly.
title: "[Bug]: "
labels: ["type: bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear summary of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. With input ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, runtime version, branch/commit, hardware if relevant.
      placeholder: "e.g. Ubuntu 24.04, branch main @ abc1234"
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste error output or attach screenshots. Remove any API keys or personal data first.
      render: shell
