# Local development stack.
#   docker compose up -d db valkey     -> just the infrastructure (run the API on your machine)
#   docker compose up --build          -> infrastructure + the API container
#
# Not in compose yet:
#   - the worker: run `python -m src.worker.worker` on your machine. Inside a container,
#     the sandbox's `docker run -v <path>` would point at a path the host cannot see.
#   - table creation: run `python -m src.db.init_db` once, or the first webhook fails.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: repofixer
      POSTGRES_PASSWORD: repofixer
      POSTGRES_DB: repofixer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repofixer -d repofixer"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://repofixer:repofixer@db:5432/repofixer
      VALKEY_URL: valkey://valkey:6379/0
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_started

volumes:
  pgdata:
